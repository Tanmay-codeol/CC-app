<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CF AI Chat</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f7f7f8;
      color: #1a1a1a;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }
    p.subtitle {
      color: #666;
      margin-top: 0;
      margin-bottom: 20px;
    }
    #chat {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      height: 60vh;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 80%;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
    }
    .assistant {
      align-self: flex-start;
      background: #eee;
      color: #1a1a1a;
    }
    form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    #resetBtn {
      background: transparent;
      color: #666;
      border: 1px solid #ccc;
      font-size: 0.85rem;
      padding: 6px 10px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>CF AI Chat</h1>
  <p class="subtitle">A small chat app running on Cloudflare Workers AI.</p>

  <div id="chat"></div>

  <form id="chatForm">
    <input type="text" id="messageInput" placeholder="Say something..." autocomplete="off" required />
    <button type="submit" id="sendBtn">Send</button>
  </form>
  <button id="resetBtn">Reset conversation</button>

  <script>
    const chatEl = document.getElementById("chat");
    const formEl = document.getElementById("chatForm");
    const inputEl = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const resetBtn = document.getElementById("resetBtn");

    let sessionId = localStorage.getItem("cf-chat-session-id");
    if (!sessionId) {
      sessionId = crypto.randomUUID();
      localStorage.setItem("cf-chat-session-id", sessionId);
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = inputEl.value.trim();
      if (!message) return;

      addMessage("user", message);
      inputEl.value = "";
      sendBtn.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, sessionId }),
        });
        const data = await res.json();
        addMessage("assistant", data.reply || "Something went wrong.");
      } catch (err) {
        addMessage("assistant", "Error reaching the server.");
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    });

    resetBtn.addEventListener("click", async () => {
      await fetch("/api/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId }),
      });
      chatEl.innerHTML = "";
    });
  </script>
</body>
</html>
